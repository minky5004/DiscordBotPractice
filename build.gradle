plugins {
    id 'java'
    id 'application'
}

group = 'com.mario.rl'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation('net.dv8tion:JDA:6.5.0') {
        exclude module: 'opus-java'
    }
    implementation 'org.slf4j:slf4j-simple:2.0.18'
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'org.flywaydb:flyway-core:13.5.0'
    // Flyway 10 부터 DB별 지원이 별도 모듈. 없으면 migrate() 가 "Unsupported Database" 로 실패한다.
    implementation 'org.flywaydb:flyway-database-postgresql:13.5.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.mario.rl.discordbot.Main'
}

tasks.named('run') {
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

test {
    useJUnitPlatform()
}