services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: enkephalin
      POSTGRES_USER: ${DB_USER:?.env 에 DB_USER 필요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 필요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
