services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: enkephalin
      POSTGRES_USER: ${DB_USER:?.env 에 DB_USER 필요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 필요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  bot:
    build: .
    env_file: .env
    environment:
      # 봇은 빈 키에 exit 0 으로 끝나 restart 가 무한 재기동 — compose 단계에서 거부
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?.env 에 DISCORD_BOT_TOKEN 필요}
      # .env 의 localhost 는 컨테이너 자기 자신 — 같은 compose 네트워크의 db 서비스로
      DB_URL: jdbc:postgresql://db:5432/enkephalin
      # 게임 폴더는 아래 볼륨으로 붙인 컨테이너 안 경로
      LIMBUS_DIR: /limbus
    volumes:
      # 게임 텍스트를 읽기만 한다. 짧은 표기는 Windows 드라이브 문자의 : 에서 잘린다.
      # 빈 값은 볼륨 정의가 깨지므로 기본값이 필요하고, 리포 루트는 .env 의 토큰까지 붙는다 — 비밀 없는 gradle 폴더로.
      - type: bind
        source: ${LIMBUS_DIR:-./gradle}
        target: /limbus
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
